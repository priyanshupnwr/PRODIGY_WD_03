<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | Prodigy WD-03</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Tic Tac Toe</h1>

        <p id="status" class="status">
            Player X's Turn
        </p>

        <section class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </section>

        <section class="scoreboard">

            <div class="score-card">

                <h3>X Wins</h3>

                <span id="xScore">0</span>

            </div>

            <div class="score-card">

                <h3>Draws</h3>

                <span id="drawScore">0</span>

            </div>

            <div class="score-card">

                <h3>O Wins</h3>

                <span id="oScore">0</span>

            </div>

        </section>

        <div class="controls">

            <button id="newGameBtn" class="btn primary">

                <i class="fa-solid fa-rotate-right"></i>

                New Game

            </button>

            <button id="resetScoreBtn" class="btn danger">

                <i class="fa-solid fa-trash"></i>

                Reset Score

            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
